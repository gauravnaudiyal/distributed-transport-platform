apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: default
data:
  SPRING_PROFILES_ACTIVE: azure
  ROUTE_SERVICE_URL: http://route-management-svc
  # If journey service runs in another namespace, update to full DNS:
  # http://journey-compatibility-svc.<namespace>.svc.cluster.local
  JOURNEY_COMPATIBILITY_SERVICE_URL: http://journey-compatibility-svc
  # Keep DB pool conservative on shared Azure PostgreSQL.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "120000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"
  SPRING_DATA_REDIS_HOST: "gtbs-cache.spaincentral.redis.azure.net"
  SPRING_DATA_REDIS_PORT: "10000"

