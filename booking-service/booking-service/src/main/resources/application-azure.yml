# Azure profile - overrides localhost settings in application.yml
spring:
  datasource:
    url: ${BOOKING_DATASOURCE_URL}
    username: ${BOOKING_DATASOURCE_USERNAME}
    password: ${BOOKING_DATASOURCE_PASSWORD}
    hikari:
      # Keep pool small in AKS to avoid exhausting Azure PostgreSQL connection slots.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:120000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

  sql:
    init:
      # Schema is already managed in shared environments; avoid startup DDL pressure.
      mode: never

  jpa:
    open-in-view: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

journey-compatibility-service:
  base-url: ${JOURNEY_COMPATIBILITY_SERVICE_URL:http://journey-compatibility-svc}

route:
  service:
    url: ${ROUTE_SERVICE_URL:http://route-management-svc}


# All other settings inherited from application.yml
