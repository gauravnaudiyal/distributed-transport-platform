apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-compatibility-svc-local
  labels:
    app: journey-compatibility-svc-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journey-compatibility-svc-local
  template:
    metadata:
      labels:
        app: journey-compatibility-svc-local
    spec:
      containers:
      - name: journey-compatibility-svc
        # Use a local tag so you don't need to push to GHCR to test
        image: journey-compatibility-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: journey-compatibility-config-local
              key: DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: journey-compatibility-secrets-local
              key: DB_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: journey-compatibility-secrets-local
              key: DB_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: journey-compatibility-config-local
              key: SPRING_REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: journey-compatibility-config-local
              key: SPRING_REDIS_PORT
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: journey-compatibility-secrets-local
              key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: journey-compatibility-svc-local
spec:
  selector:
    app: journey-compatibility-svc-local
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: LoadBalancer # Docker Desktop will expose this on localhost:8082
