apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: journey-kv-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "ffbb5ff4-406a-494f-8de9-9776e768f1ed"
    keyvaultName: "ds-gtbs-kv-prod"
    tenantId: "d595be8d-b306-45f4-8064-9e5b82fbe52b"
    objects: |
      array:
        - |
          objectName: db-username
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: booking-datasource-url
          objectType: secret
        - |
          objectName: booking-datasource-username
          objectType: secret
        - |
          objectName: booking-datasource-password
          objectType: secret
  secretObjects:
    - secretName: journey-kv-synced
      type: Opaque
      data:
        - objectName: db-username
          key: DB_USERNAME
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: redis-password
          key: REDIS_PASSWORD
        - objectName: booking-datasource-url
          key: BOOKING_DATASOURCE_URL
        - objectName: booking-datasource-username
          key: BOOKING_DATASOURCE_USERNAME
        - objectName: booking-datasource-password
          key: BOOKING_DATASOURCE_PASSWORD
