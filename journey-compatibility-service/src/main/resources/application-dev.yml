spring:
  datasource:
    # Primary Database (local/internal)
    primary:
      driver-class-name: org.postgresql.Driver
      jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ds-gtbs.postgres.database.azure.com:5432/global_traffic_system?sslmode=require}
      username: ${SPRING_DATASOURCE_USERNAME:ds_gtb_sadmin}
      password: ${SPRING_DATASOURCE_PASSWORD:dsProject1}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 5000

    # Booking Database (external Azure PostgreSQL)
    booking:
      driver-class-name: org.postgresql.Driver
      jdbc-url: ${BOOKING_DATASOURCE_URL:jdbc:postgresql://bkdemo123-postgres.postgres.database.azure.com:5432/booking_db?sslmode=require}
      username: ${BOOKING_DATASOURCE_USERNAME:bookingadmin}
      password: ${BOOKING_DATASOURCE_PASSWORD:BookingDemo2025}
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

app:
  reconciliation:
    use-external-booking-db: true   # Query external `bookings` table by default in dev
    log-queries: true

server:
  port: 8082
