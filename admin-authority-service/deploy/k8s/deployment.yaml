# Replace ghcr.io/OWNER/admin-authority-service:TAG with your image from GHCR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-authority-service
  labels:
    app: admin-authority-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-authority-service
  template:
    metadata:
      labels:
        app: admin-authority-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/OWNER/admin-authority-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: admin-authority-secrets
                  key: database-url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: admin-authority-secrets
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-authority-secrets
                  key: database-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: admin-authority-config
                  key: kafka-bootstrap-servers
                  optional: true
            - name: ROUTE_MANAGEMENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: admin-authority-config
                  key: route-management-base-url
            - name: BOOKING_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: admin-authority-config
                  key: booking-service-base-url
            - name: GTBS_REGION_ID
              valueFrom:
                configMapKeyRef:
                  name: admin-authority-config
                  key: gtbs-region-id
            - name: APP_SECURITY_ENABLED
              value: "true"
            - name: JWT_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: admin-authority-secrets
                  key: jwt-issuer-uri
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
