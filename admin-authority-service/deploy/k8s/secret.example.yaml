# Do NOT commit real secrets. Create from literals or Azure Key Vault / CSI driver.
# Example:
# kubectl create secret generic admin-authority-secrets \
#   --from-literal=database-url='jdbc:postgresql://...' \
#   --from-literal=database-user='...' \
#   --from-literal=database-password='...' \
#   --from-literal=jwt-issuer-uri='https://...'
#
# Keys must match deployment.yaml secretKeyRef names.
apiVersion: v1
kind: Secret
metadata:
  name: admin-authority-secrets
type: Opaque
stringData:
  database-url: "jdbc:postgresql://postgres:5432/gtbs_authority"
  database-username: "replace-me"
  database-password: "replace-me"
  jwt-issuer-uri: "https://your-idp.example/realms/gtbs"
